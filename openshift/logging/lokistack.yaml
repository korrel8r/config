apiVersion: v1

kind: Secret
metadata:
  name: seaweedfs
  namespace: openshift-logging
stringData:
  access_key_id: seaweedfs
  access_key_secret: seaweedfs123
  bucketnames: loki
  endpoint: http://seaweedfs.seaweedfs.svc:8333
type: Opaque
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: logging-loki
  namespace: openshift-logging
spec:
  size: 1x.demo
  storage:
    schemas:
      - effectiveDate: "2024-10-01"
        version: v13
    secret:
      name: seaweedfs
      type: s3
  storageClassName: local-storage
  tenants:
    mode: openshift-logging
  rules:
    enabled: true
    selector:
      matchLabels:
        openshift.io/log-alerting: "true"
    namespaceSelector:
      matchLabels:
        openshift.io/log-alerting: "true"
